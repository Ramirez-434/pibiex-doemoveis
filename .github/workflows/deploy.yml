name: Deploy Frontend to Hostinger FTP

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'

jobs:
  web-deploy:
    name: Build and Deploy Frontend
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      
    - name: Use Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'web/package-lock.json'
        
    - name: Install Dependencies
      working-directory: ./web
      run: npm ci
      
    - name: Build Project
      working-directory: ./web
      run: npm run build
      
    - name: Sync files via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./web/dist/
        # Importante: O server-dir deve ser o caminho raiz público na hospedagem. 
        # Muitas vezes é public_html/ ou htdocs/. Ajuste se necessário!
        server-dir: ./public_html/
        # A flag abaixo fará o "Clean Deploy" (apaga os arquivos velhos)
        dangerous-clean-slate: true
