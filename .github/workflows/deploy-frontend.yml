name: Deploy Frontend to HostGator

on:
  push:
    branches:
      - main
    paths:
      - 'web/**' # Executa apenas quando houver mudanças na pasta do frontend

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4
    
    - name: Use Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: web/package-lock.json
      
    - name: 📦 Install Dependencies
      working-directory: ./web
      run: npm ci
      
    - name: 🔨 Build Project
      working-directory: ./web
      env:
        VITE_API_URL: https://doebrasil.onrender.com
        VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
      run: npm run build
      
    - name: 📂 Sync files to HostGator
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./web/dist/
        # Ao apontar o usuário FTP direto para a raiz do domínio no cPanel, deixamos server-dir vazio ou como ./
        server-dir: ./
